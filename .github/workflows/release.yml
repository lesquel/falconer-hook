name: release

# On a `v*` tag: build static/standalone binaries for every supported
# platform, then publish them with one SHA256SUMS file, signed with minisign
# (SHA256SUMS.minisig, key in minisign.pub), to the GitHub release.
# Asset names: falconer-hook-<target>.tar.gz (install.sh relies on them).
#
# Supply chain: every action is pinned to a full commit SHA, only `actions/*`
# actions are used, nothing is cached, and the signing key is only visible to
# the `sign` job, which runs no third-party action and only sees SHA256SUMS.
# Its trusted comment is `falconer-hook <tag>` (install.sh checks it).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # rsign2 (minisign-compatible; Ubuntu's minisign cannot read unencrypted keys),
  # pinned by version and by the SHA-256 of its crate from crates.io.
  RSIGN2_VERSION: "0.6.7"
  RSIGN2_SHA256: "8d782ff513d21d337d3bcc2db62d0ea494e2e1b761e3c5678f60660d343a79f5"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = true ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist pkg
          cp target/${{ matrix.target }}/release/falconer-hook pkg/
          tar -czf dist/falconer-hook-${{ matrix.target }}.tar.gz -C pkg falconer-hook
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: falconer-hook-${{ matrix.target }}
          path: dist/falconer-hook-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: falconer-hook-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum falconer-hook-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error

  sign:
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sha256sums
          path: dist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          persist-credentials: false
          sparse-checkout: minisign.pub
          sparse-checkout-cone-mode: false
      - name: Install rsign2 (pinned crate checksum, locked dependencies)
        run: |
          work="$RUNNER_TEMP/rsign2"
          mkdir -p "$work"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$work/rsign2.crate" \
            "https://static.crates.io/crates/rsign2/rsign2-${RSIGN2_VERSION}.crate"
          echo "${RSIGN2_SHA256}  $work/rsign2.crate" | sha256sum -c -
          tar -xzf "$work/rsign2.crate" -C "$work"
          cargo install --locked --path "$work/rsign2-${RSIGN2_VERSION}" --root "$work/root"
          echo "$work/root/bin" >> "$GITHUB_PATH"
      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is not set" >&2; exit 1; }
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          # Unencrypted key: no password prompt (stdin closed so it never waits).
          rsign sign -W -s "$key" -t "falconer-hook $GITHUB_REF_NAME" SHA256SUMS < /dev/null
          rm -f "$key"
          # The secret must match the public key committed in the repository.
          rsign verify -q -p ../src/minisign.pub SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256sums-minisig
          path: dist/SHA256SUMS.minisig
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l
          test "$(ls falconer-hook-*.tar.gz | wc -l)" -eq 4
          test -s SHA256SUMS && test -s SHA256SUMS.minisig
          sha256sum -c SHA256SUMS
          # v1.2.0-rc.1 and similar test builds are pre-releases: the
          # installer's "latest" never picks them.
          case "$TAG" in
            *-*) flags="--prerelease --latest=false" ;;
            *) flags="--latest" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "" $flags \
            falconer-hook-*.tar.gz SHA256SUMS SHA256SUMS.minisig
