name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          dir=dist
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/openmosh-hook "$dir/"
          tar -czf openmosh-hook-${{ matrix.target }}.tar.gz -C "$dir" openmosh-hook
          sha256sum openmosh-hook-${{ matrix.target }}.tar.gz > openmosh-hook-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            openmosh-hook-${{ matrix.target }}.tar.gz
            openmosh-hook-${{ matrix.target }}.tar.gz.sha256

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/openmosh-hook \
            target/x86_64-apple-darwin/release/openmosh-hook \
            target/aarch64-apple-darwin/release/openmosh-hook
          tar -czf openmosh-hook-universal-apple-darwin.tar.gz -C dist openmosh-hook
          shasum -a 256 openmosh-hook-universal-apple-darwin.tar.gz > openmosh-hook-universal-apple-darwin.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            openmosh-hook-universal-apple-darwin.tar.gz
            openmosh-hook-universal-apple-darwin.tar.gz.sha256
