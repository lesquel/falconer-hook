name: release

# On a `v*` tag: build static/standalone binaries for every supported
# platform, then publish them with one SHA256SUMS file, signed with minisign
# (SHA256SUMS.minisig, key in minisign.pub), to the GitHub release.
# Asset names: openmosh-hook-<target>.tar.gz (install.sh relies on them).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = true ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist pkg
          cp target/${{ matrix.target }}/release/openmosh-hook pkg/
          tar -czf dist/openmosh-hook-${{ matrix.target }}.tar.gz -C pkg openmosh-hook
      - uses: actions/upload-artifact@v4
        with:
          name: openmosh-hook-${{ matrix.target }}
          path: dist/openmosh-hook-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum openmosh-hook-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: minisign.pub
          sparse-checkout-cone-mode: false
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is not set" >&2; exit 1; }
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          # Unencrypted key: no password prompt (stdin closed so it never waits).
          minisign -S -s "$key" -m SHA256SUMS -t "openmosh-hook $GITHUB_REF_NAME" < /dev/null
          rm -f "$key"
          # The secret must match the public key committed in the repository.
          minisign -V -p ../src/minisign.pub -m SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openmosh-hook-*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
          fail_on_unmatched_files: true
